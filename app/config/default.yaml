logger:
    # error: 0
    # warn: 1
    # info: 2
    # verbose: 3
    # debug: 4
    # silly: 5
    # allow individual modules to set level from method logger.getLogger()
    allowModuleOverride: false
    file: /var/log/error.log
    fileLogging: true
    fileLoggingLevel: error
    consoleLogging: true
    consoleLoggingLevel: debug # overall logging level
app:
    consoleLoggingLevel: warn
tasks:
    welcome:
        pauseDurationMs: 1000 # milliseconds
    read:
        # intervalMs: 50 # milliseconds
        intervalMs: 1000 # milliseconds
peripherals:
    lcdScreen:
        config:
            consoleLoggingLevel: warn
            boardDebug: false
            lcdType: LCM1602
            bus:
                number: 1
                address: 0x20
    uvSensor:
        config:
            consoleLoggingLevel: warn
            logReadingsToConsole: false
            dynamicRangeHigh: false # HD mode increases the bit depth, but requires manual coefficients calibration, false or normal is the default
            integrationTimesMs: [50, 100, 200, 400, 800] # (100ms is default)
            integrationTimeInitialIndex: 4 # 0-4
            readSensorIntervalMs: 50
            reconfigureSensorIntervalMs: 5000 # Should be greater than highest possible integration time and allow time for sensor reading lag after reconfiguration
            bus:
                number: 1
                address: 0x10